name: Playwright

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_scope:
        description: Test scope
        required: true
        default: regression
        type: choice
        options:
          - regression
          - ui
          - api
          - performance
          - all

permissions:
  contents: read

env:
  CI: true
  WORKERS: 2

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  chromium:
    name: Chromium (${{ inputs.test_scope || 'regression' }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run tests
        env:
          TEST_SCOPE: ${{ inputs.test_scope || 'regression' }}
        run: |
          case "$TEST_SCOPE" in
            ui) npm run test:ui -- --project=chromium ;;
            api) npm run test:api -- --project=chromium ;;
            performance) npm run test:performance -- --project=chromium ;;
            all) npm test -- --project=chromium ;;
            *) npm run test:regression -- --project=chromium ;;
          esac
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium
          path: playwright-report/
          retention-days: 14
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-chromium
          path: test-results/
          retention-days: 14

  cross-browser-ui:
    name: UI (${{ matrix.project }})
    needs: quality
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.test_scope != 'api' && inputs.test_scope != 'performance') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: mobile-chrome
            browser: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run tests
        env:
          PROJECT: ${{ matrix.project }}
          TEST_SCOPE: ${{ inputs.test_scope || 'regression' }}
        run: |
          case "$TEST_SCOPE" in
            ui) npm run test:ui -- --project="$PROJECT" ;;
            all) npm test -- --project="$PROJECT" ;;
            *) npm run test:regression -- --project="$PROJECT" ;;
          esac
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.project }}
          path: test-results/
          retention-days: 14
